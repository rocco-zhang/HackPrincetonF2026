<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPELLCAM</title>
  </head>
  <body>
    <div id="stage">
      <video id="cam" playsinline muted></video>
      <div id="game"></div>
      <canvas id="debug"></canvas>
      <div id="gate">
        <h1>SPELLCAM</h1>
        <p class="tag">You're a stick figure. The paper monsters want you. Draw them away.</p>
        <button id="enable">Enable camera &amp; sound</button>
        <label id="camPick" hidden>Camera <select id="camSelect"></select></label>
        <button id="mouseOnly" class="secondary">Play with mouse only</button>
        <p id="gateMsg"></p>
      </div>
    </div>
    <div id="lobby" hidden>
      <h2>Versus</h2>
      <p id="lobbyStatus"></p>
      <div id="lobbyMenu">
        <label id="lobbyNameRow">Your name <input id="lobbyName" maxlength="16" autocomplete="off" spellcheck="false" /></label>
        <div class="lobbyRow">
          <button id="lobbyQuick">Quick match</button>
          <button id="lobbyHostPublic" class="secondary">Host a public game</button>
        </div>
        <div id="lobbyRooms">
          <div id="lobbyRoomsHead">
            <span>Open games</span>
            <button id="lobbyRefresh" class="secondary small">Refresh</button>
          </div>
          <ul id="lobbyRoomList"></ul>
        </div>
        <div class="lobbyRow" id="lobbyPrivate">
          <button id="lobbyHost" class="secondary">Host a private game</button>
          <span>or join a code</span>
          <input id="lobbyCode" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Friend's four-letter code" />
          <button id="lobbyJoin" class="secondary">Join</button>
        </div>
      </div>
      <div id="lobbyFoot">
        <button id="lobbyLeave" class="secondary">Disconnect</button>
        <button id="lobbyClose" class="secondary">Close</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
